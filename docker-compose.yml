version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: analytics_password
      POSTGRES_DB: analytics_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: analytics_api
    ports:
    - "8080:8000"
    volumes:
    - .:/code
    environment:
    - DATABASE_URL=postgresql+psycopg://postgres:analytics_password@db:5432/analytics_saas
    - NEXORA_API_KEY=@Ahoracaigo327
    depends_on:
    - db

volumes:
  postgres_data: